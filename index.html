<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Galería</title>
<style>
:root{--bg:#081024;--bg2:#111a38;--fg:#f4f7ff;--muted:#9ca8ca;--line:#ffffff1d;--glass:#ffffff0d;--a:#4f8cff;--b:#8b6cff;color-scheme:dark}
:root[data-theme="emerald"]{--bg:#061610;--bg2:#0d291d;--a:#2fd6a3;--b:#18a8d4}
:root[data-theme="amber"]{--bg:#170d06;--bg2:#30190b;--a:#f0a24a;--b:#e35a3c}
:root[data-theme="rose"]{--bg:#190814;--bg2:#311027;--a:#ff6fa5;--b:#9d5cff}
:root[data-theme="light"]{--bg:#eef3ff;--bg2:#fff;--fg:#141a33;--muted:#616b8b;--line:#25345c1c;--glass:#ffffffa6;color-scheme:light}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}
body{background:radial-gradient(70% 45% at 15% 0%,color-mix(in srgb,var(--a) 28%,transparent),transparent),radial-gradient(55% 45% at 95% 20%,color-mix(in srgb,var(--b) 22%,transparent),transparent),linear-gradient(180deg,var(--bg),var(--bg2));background-attachment:fixed}
button,input{font:inherit}.app{max-width:650px;margin:auto;padding:calc(14px + env(safe-area-inset-top)) 16px calc(32px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;gap:12px}.logo{width:50px;height:50px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(135deg,var(--a),var(--b));box-shadow:0 12px 32px #0005;font-size:24px}h1{font-size:27px;margin:0;letter-spacing:-.03em}.sub{font-size:13px;color:var(--muted);margin:2px 0 0}.grow{flex:1}.icon{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--glass);color:var(--fg);font-size:18px}.search{max-height:0;overflow:hidden;transition:.3s}.search.on{max-height:64px;padding-top:12px}.search input{width:100%;border:1px solid var(--line);background:var(--glass);color:var(--fg);border-radius:16px;padding:13px 15px;outline:none}
.empty{margin-top:46px;border:1px solid var(--line);background:var(--glass);border-radius:28px;padding:38px 24px;text-align:center;backdrop-filter:blur(18px)}.empty .hero{font-size:56px}.empty h2{margin:12px 0 8px}.empty p{color:var(--muted);line-height:1.6}.btn{border:1px solid var(--line);background:var(--glass);color:var(--fg);border-radius:14px;padding:11px 16px;cursor:pointer}.btn.primary{border:0;background:linear-gradient(135deg,var(--a),var(--b));color:#fff;font-weight:700}.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
#gallery{display:none}.stage{position:relative;height:min(72vw,430px);margin:22px -8px 4px;perspective:1100px;touch-action:pan-y}.card{position:absolute;left:17%;top:4%;width:66%;height:82%;border-radius:24px;overflow:hidden;background:#111;box-shadow:0 30px 70px #0009;border:1px solid #ffffff22;transition:transform .55s cubic-bezier(.2,.8,.2,1),opacity .4s,filter .4s;cursor:pointer}.card img{width:100%;height:100%;object-fit:cover}.card.center{box-shadow:0 32px 78px #000b,0 0 0 1px var(--a),0 0 36px color-mix(in srgb,var(--a) 48%,transparent)}.nav{position:absolute;z-index:20;top:44%;width:48px;height:48px;border-radius:50%;border:1px solid color-mix(in srgb,var(--a) 65%,transparent);background:#08102499;color:#fff;font-size:27px}.nav.prev{left:5px}.nav.next{right:5px}.counter{position:absolute;z-index:20;right:14px;top:14px;background:#081024aa;color:#fff;border:1px solid #ffffff22;border-radius:999px;padding:6px 11px;font-size:12px}.dots{text-align:center;min-height:25px}.dot{display:inline-block;width:7px;height:7px;background:color-mix(in srgb,var(--a) 30%,transparent);border-radius:9px;margin:0 3px;transition:.25s}.dot.on{width:27px;background:var(--a)}
.panel{margin-top:8px;border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(18px);border-radius:24px;padding:18px}.panel h2{margin:0;font-size:21px}.meta{color:var(--muted);font-size:13px;margin-top:6px}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}.actions button{border:1px solid var(--line);background:var(--glass);color:var(--fg);border-radius:14px;padding:10px 6px}.actions button.on{outline:2px solid var(--a)}
.days{margin-top:24px}.day{margin:24px 0}.day h3{font-size:14px;color:var(--muted)}.thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.thumb{aspect-ratio:1;border-radius:14px;overflow:hidden;border:0;padding:0;background:#111}.thumb img{width:100%;height:100%;object-fit:cover}.thumb.active{outline:2px solid var(--a);outline-offset:2px}
.sheet{position:fixed;inset:0;z-index:50;background:#0008;display:none;align-items:flex-end}.sheet.on{display:flex}.sheetbox{width:min(650px,100%);margin:auto;background:color-mix(in srgb,var(--bg2) 94%,transparent);border:1px solid var(--line);border-radius:28px 28px 0 0;padding:18px 16px calc(22px + env(safe-area-inset-bottom));backdrop-filter:blur(26px)}.sheetbox h3{margin:4px 4px 12px}.menu{display:grid;gap:8px}.menu button{display:flex;align-items:center;gap:12px;text-align:left;border:1px solid var(--line);background:var(--glass);color:var(--fg);border-radius:16px;padding:12px}.menu b{font-size:18px}.themes{display:flex;gap:9px;margin-top:14px;flex-wrap:wrap}.theme{width:42px;height:42px;border-radius:50%;border:2px solid #fff6}.t1{background:linear-gradient(135deg,#4f8cff,#8b6cff)}.t2{background:linear-gradient(135deg,#2fd6a3,#18a8d4)}.t3{background:linear-gradient(135deg,#f0a24a,#e35a3c)}.t4{background:linear-gradient(135deg,#ff6fa5,#9d5cff)}.t5{background:linear-gradient(135deg,#fff,#b8c8ff)}
.lightbox{position:fixed;inset:0;z-index:70;background:#030615f5;display:none;align-items:center;justify-content:center}.lightbox.on{display:flex}.lightbox img{max-width:100vw;max-height:100vh;object-fit:contain}.close{position:absolute;right:14px;top:calc(14px + env(safe-area-inset-top));z-index:3}.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:#111a2ff2;color:#fff;border:1px solid #ffffff22;border-radius:999px;padding:10px 15px;transition:.3s;z-index:100;font-size:13px}.toast.on{opacity:1;transform:translate(-50%,0)}
@media(max-width:480px){.thumbs{grid-template-columns:repeat(3,1fr)}.stage{height:390px}.card{left:14%;width:72%}}
</style>
</head>
<body>
<div class="app">
<header>
<div class="logo">▣</div>
<div class="grow"><h1>Galería</h1><p class="sub">Explora y revive tus mejores momentos</p></div>
<button class="icon" id="searchBtn" aria-label="Buscar">⌕</button>
<button class="icon" id="menuBtn" aria-label="Menú">•••</button>
<input id="picker" type="file" accept="image/*" multiple hidden>
</header>
<div class="search" id="search"><input id="q" type="search" placeholder="Buscar fotografías…"></div>

<section class="empty" id="empty">
<div class="hero">▧</div><h2>Tu galería empieza aquí</h2>
<p>Selecciona fotografías de tu dispositivo. Se organizan por fecha y permanecen únicamente en tu equipo.</p>
<div class="row"><button class="btn primary" id="choose">Elegir fotos</button><button class="btn" id="demo">Ver demo</button></div>
</section>

<main id="gallery">
<section class="stage" id="stage">
<div id="cards"></div>
<button class="nav prev" id="prev">‹</button><button class="nav next" id="next">›</button>
<div class="counter" id="counter"></div>
</section>
<div class="dots" id="dots"></div>
<section class="panel">
<h2 id="title"></h2><div class="meta" id="meta"></div>
<div class="actions">
<button id="fav">♡ Favorito</button><button id="full">⛶ Ampliar</button><button id="remove">⌫ Quitar</button>
</div>
</section>
<div class="days" id="days"></div>
</main>
</div>

<div class="sheet" id="sheet"><div class="sheetbox">
<h3>Opciones</h3>
<div class="menu">
<button id="add"><b>＋</b><span>Añadir fotografías</span></button>
<button id="auto"><b>▶</b><span id="autoLabel">Reproducción automática</span></button>
<button id="clear"><b>⌫</b><span>Vaciar galería</span></button>
</div>
<h3 style="margin-top:18px">Tema</h3>
<div class="themes">
<button class="theme t1" data-theme=""></button><button class="theme t2" data-theme="emerald"></button>
<button class="theme t3" data-theme="amber"></button><button class="theme t4" data-theme="rose"></button>
<button class="theme t5" data-theme="light"></button>
</div>
</div></div>

<div class="lightbox" id="lightbox"><button class="icon close" id="close">×</button><img id="big" alt=""></div>
<div class="toast" id="toast"></div>

<script>
var photos=[],view=[],cur=0,query="",autoTimer=null,startX=null;
var favs=new Set(JSON.parse(localStorage.getItem("gal-favs")||"[]"));
function $(s){return document.querySelector(s)}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]})}
function toast(s){var t=$("#toast");t.textContent=s;t.classList.add("on");clearTimeout(t._x);t._x=setTimeout(function(){t.classList.remove("on")},1800)}
function fmt(d){return new Intl.DateTimeFormat("es-MX",{day:"numeric",month:"long",year:"numeric",hour:"2-digit",minute:"2-digit"}).format(d)}
function dayKey(d){return d.getFullYear()+"-"+d.getMonth()+"-"+d.getDate()}
function addFiles(files){
 var list=[].slice.call(files).filter(function(f){return f.type.indexOf("image/")===0});
 if(!list.length)return;
 list.forEach(function(f){
  photos.push({id:(crypto.randomUUID?crypto.randomUUID():Date.now()+"-"+Math.random()),name:f.name,url:URL.createObjectURL(f),date:new Date(f.lastModified||Date.now()),demo:false});
 });
 photos.sort(function(a,b){return b.date-a.date});cur=0;render();toast(list.length+" fotos añadidas");
}
function demo(){
 var colors=[["#f7c779","#d76b5d"],["#74d8df","#155e8a"],["#ae92ff","#171842"],["#74bb7b","#183c2b"],["#ff8bb7","#57305f"],["#e2ad67","#29354d"]];
 for(var i=0;i<12;i++){
  var c=document.createElement("canvas");c.width=900;c.height=1100;var g=c.getContext("2d");
  var p=colors[i%colors.length],gr=g.createLinearGradient(0,0,0,c.height);gr.addColorStop(0,p[0]);gr.addColorStop(1,p[1]);g.fillStyle=gr;g.fillRect(0,0,c.width,c.height);
  g.fillStyle="rgba(255,255,255,.86)";g.beginPath();g.arc(260+(i%3)*120,300,65,0,Math.PI*2);g.fill();
  g.fillStyle="rgba(5,10,25,.45)";g.beginPath();g.moveTo(0,800);g.lineTo(260,620);g.lineTo(430,760);g.lineTo(650,560);g.lineTo(900,790);g.lineTo(900,1100);g.lineTo(0,1100);g.fill();
  photos.push({id:"demo-"+Date.now()+"-"+i,name:"Momento "+(i+1),url:c.toDataURL("image/jpeg",.88),date:new Date(Date.now()-Math.floor(i/3)*86400000-i*1800000),demo:true});
 }
 cur=0;render();toast("Demo cargada");
}
function filter(){
 view=photos.filter(function(p){return !query||p.name.toLowerCase().indexOf(query)>-1});
 if(cur>=view.length)cur=Math.max(0,view.length-1);
}
function render(){
 filter();
 $("#empty").style.display=photos.length?"none":"block";$("#gallery").style.display=photos.length?"block":"none";
 if(!photos.length)return;
 renderCards();renderInfo();renderDays();
}
function renderCards(){
 var box=$("#cards");box.innerHTML="";
 view.forEach(function(p,i){
  var d=i-cur,ad=Math.abs(d);if(ad>3)return;
  var el=document.createElement("div");el.className="card"+(d===0?" center":"");
  var x=d*44,z=-ad*115,ry=d*-22,sc=1-ad*.12,op=1-ad*.22;
  el.style.transform="translateX("+x+"%) translateZ("+z+"px) rotateY("+ry+"deg) scale("+sc+")";
  el.style.opacity=op;el.style.zIndex=20-ad;
  el.innerHTML='<img src="'+p.url+'" alt="'+esc(p.name)+'">';
  el.onclick=function(){if(d===0)openFull();else{cur=i;renderCards();renderInfo()}};
  box.appendChild(el);
 });
 $("#counter").textContent=view.length?(cur+1)+" / "+view.length:"0 / 0";
 $("#dots").innerHTML=view.slice(Math.max(0,cur-4),Math.min(view.length,cur+5)).map(function(p,i,a){var real=Math.max(0,cur-4)+i;return '<i class="dot '+(real===cur?"on":"")+'"></i>'}).join("");
}
function renderInfo(){
 var p=view[cur];if(!p){$("#title").textContent="Sin resultados";$("#meta").textContent="";return}
 $("#title").textContent=p.name;$("#meta").textContent=fmt(p.date);
 var on=favs.has(p.id);$("#fav").classList.toggle("on",on);$("#fav").textContent=on?"♥ Favorito":"♡ Favorito";
}
function renderDays(){
 var groups={};photos.forEach(function(p){var k=dayKey(p.date);(groups[k]||(groups[k]=[])).push(p)});
 $("#days").innerHTML=Object.keys(groups).map(function(k){
  var arr=groups[k],label=new Intl.DateTimeFormat("es-MX",{weekday:"long",day:"numeric",month:"long"}).format(arr[0].date);
  return '<section class="day"><h3>'+label+'</h3><div class="thumbs">'+arr.map(function(p){return '<button class="thumb '+(view[cur]&&view[cur].id===p.id?"active":"")+'" data-id="'+p.id+'"><img src="'+p.url+'"></button>'}).join("")+'</div></section>';
 }).join("");
 [].slice.call(document.querySelectorAll(".thumb")).forEach(function(b){b.onclick=function(){var id=b.getAttribute("data-id");query="";$("#q").value="";view=photos.slice();cur=view.findIndex(function(p){return p.id===id});render()}});
}
function go(n){if(!view.length)return;cur=(n+view.length)%view.length;renderCards();renderInfo()}
function openFull(){var p=view[cur];if(!p)return;$("#big").src=p.url;$("#lightbox").classList.add("on")}
function closeFull(){$("#lightbox").classList.remove("on")}
function setTheme(t){if(t)document.documentElement.dataset.theme=t;else document.documentElement.removeAttribute("data-theme");localStorage.setItem("gal-theme",t)}
function toggleAuto(){
 if(autoTimer){clearInterval(autoTimer);autoTimer=null;$("#autoLabel").textContent="Reproducción automática";toast("Reproducción detenida")}
 else{autoTimer=setInterval(function(){go(cur+1)},4000);$("#autoLabel").textContent="Detener reproducción";toast("Reproducción automática activada")}
}
function androidHandleBack(){
 if($("#lightbox").classList.contains("on")){closeFull();return true}
 if($("#sheet").classList.contains("on")){$("#sheet").classList.remove("on");return true}
 if($("#search").classList.contains("on")){$("#searchBtn").click();return true}
 return false;
}
$("#choose").onclick=$("#add").onclick=function(){$("#sheet").classList.remove("on");$("#picker").click()};
$("#picker").onchange=function(e){addFiles(e.target.files);e.target.value=""};
$("#demo").onclick=demo;$("#prev").onclick=function(){go(cur-1)};$("#next").onclick=function(){go(cur+1)};
$("#full").onclick=openFull;$("#close").onclick=closeFull;$("#lightbox").onclick=function(e){if(e.target.id==="lightbox")closeFull()};
$("#fav").onclick=function(){var p=view[cur];if(!p)return;if(favs.has(p.id))favs.delete(p.id);else favs.add(p.id);localStorage.setItem("gal-favs",JSON.stringify(Array.from(favs)));renderInfo()};
$("#remove").onclick=function(){var p=view[cur];if(!p)return;if(!p.demo)URL.revokeObjectURL(p.url);photos=photos.filter(function(x){return x.id!==p.id});render();toast("Foto quitada")};
$("#clear").onclick=function(){photos.forEach(function(p){if(!p.demo)URL.revokeObjectURL(p.url)});photos=[];cur=0;$("#sheet").classList.remove("on");render();toast("Galería vacía")};
$("#menuBtn").onclick=function(){$("#sheet").classList.add("on")};$("#sheet").onclick=function(e){if(e.target.id==="sheet")$("#sheet").classList.remove("on")};
$("#searchBtn").onclick=function(){var s=$("#search");s.classList.toggle("on");if(s.classList.contains("on"))$("#q").focus();else{$("#q").value="";query="";render()}};
$("#q").oninput=function(e){query=e.target.value.trim().toLowerCase();cur=0;render()};
$("#auto").onclick=toggleAuto;[].slice.call(document.querySelectorAll(".theme")).forEach(function(b){b.onclick=function(){setTheme(b.getAttribute("data-theme"));$("#sheet").classList.remove("on")}});
$("#stage").addEventListener("touchstart",function(e){startX=e.touches[0].clientX},{passive:true});
$("#stage").addEventListener("touchend",function(e){if(startX===null)return;var dx=e.changedTouches[0].clientX-startX;if(Math.abs(dx)>45)go(cur+(dx<0?1:-1));startX=null},{passive:true});
document.addEventListener("keydown",function(e){if(e.key==="ArrowRight")go(cur+1);if(e.key==="ArrowLeft")go(cur-1);if(e.key==="Escape")androidHandleBack()});
["dragenter","dragover"].forEach(function(n){document.addEventListener(n,function(e){e.preventDefault()})});document.addEventListener("drop",function(e){e.preventDefault();addFiles(e.dataTransfer.files)});
setTheme(localStorage.getItem("gal-theme")||"");render();
</script>
</body>
</html>
